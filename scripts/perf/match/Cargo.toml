[workspace]
resolver="3"
members=["trial-library-move","trial-library-batch","trial-match-stack","trial-match-weights","trial-import-index"]
[workspace.package]
version="2.14.1"
edition="2024"
rust-version="1.98"
[workspace.lints.rust]
unsafe_op_in_unsafe_fn="deny"
[package]
name="muzik-dod-match-experiments"
version="0.1.0"
edition="2024"
[dependencies]
serde={version="1",features=["derive"]}
serde_json={version="1",features=["float_roundtrip"]}
base_match={package="muzik-match",path="@ROOT@/crates/muzik-match"}
base_library={package="muzik-library",path="@ROOT@/crates/muzik-library"}
base_import={package="muzik-import",path="@ROOT@/crates/muzik-import"}
muzik_core={package="muzik-core",path="@ROOT@/crates/muzik-core"}
muzik_metadata={package="muzik-metadata",path="@ROOT@/crates/muzik-metadata"}
trial_library_move={package="trial-library-move",path="trial-library-move"}
trial_library_batch={package="trial-library-batch",path="trial-library-batch"}
trial_match_stack={package="trial-match-stack",path="trial-match-stack"}
trial_match_weights={package="trial-match-weights",path="trial-match-weights"}
trial_import_index={package="trial-import-index",path="trial-import-index"}
[profile.release]
opt-level="z"
lto=true
codegen-units=1
strip="symbols"
