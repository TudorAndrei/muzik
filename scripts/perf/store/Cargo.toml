[workspace]
members=["store-candidate"]
resolver="3"
[workspace.package]
version="2.14.1"
edition="2024"
rust-version="1.98"
[workspace.lints.rust]
unsafe_op_in_unsafe_fn="deny"
[package]
name="muzik-dod-store"
version="0.1.0"
edition="2024"
[dependencies]
muzik-store={path="@ROOT@/crates/muzik-store"}
muzik-store-dod={path="store-candidate"}
muzik-core={path="@ROOT@/crates/muzik-core"}
muzik-workflow={path="@ROOT@/crates/muzik-workflow"}
muzik-media={path="@ROOT@/crates/muzik-media"}
muzik-soulseek={path="@ROOT@/crates/muzik-soulseek"}
serde={version="1",features=["derive"]}
serde_json="1"
rusqlite={version="0.41",features=["bundled","serde_json"]}
[profile.release]
opt-level="z"
lto=true
codegen-units=1
strip="symbols"
