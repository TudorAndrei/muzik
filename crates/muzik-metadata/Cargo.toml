[package]
name = "muzik-metadata"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
description = "MusicBrainz release search and lookup for muzik"

[lints]
workspace = true

[dependencies]
backon = { version = "1.6", default-features = false, features = ["std", "std-blocking-sleep"] }
governor = { version = "0.10", default-features = false, features = ["std"] }
musicbrainz_rs = { version = "0.14", features = ["sync", "rustls"] }
muzik-core = { path = "../muzik-core" }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
