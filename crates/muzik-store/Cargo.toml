[package]
name = "muzik-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false
description = "The muzik.db state database: job queue, watchlist, and sync records"

[lints]
workspace = true

[dependencies]
muzik-core = { path = "../muzik-core" }
muzik-library = { path = "../muzik-library" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
parking_lot = "0.12"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled", "serde_json"] }
rusqlite_migration = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = "0.28"
strum_macros = "0.28"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
