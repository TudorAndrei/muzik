[package]
name = "muzik-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false
description = "The muzik.db state database: job queue, watchlist, and sync records"

[lints]
workspace = true

[dependencies]
muzik-core = { path = "../muzik-core" }
muzik-library = { path = "../muzik-library" }
jiff = "1.0"
parking_lot = "0.13"
regex = "1"
rusqlite = { version = "0.43", features = ["bundled", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = "0.28"
strum_macros = "0.28"
thiserror = "2"

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
tempfile = "3"
