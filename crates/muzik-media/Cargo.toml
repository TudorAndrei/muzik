[package]
name = "muzik-media"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
description = "ffmpeg, audio quality, and the chapter splitter for muzik"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
muzik-core = { path = "../muzik-core" }
muzik-tags = { path = "../muzik-tags" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
