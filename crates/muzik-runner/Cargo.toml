[package]
name = "muzik-runner"
version = "2.7.2"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[dependencies]
muzik-agent = { path = "../muzik-agent" }
muzik-core = { path = "../muzik-core" }
muzik-import = { path = "../muzik-import" }
muzik-jobs = { path = "../muzik-jobs" }
muzik-library = { path = "../muzik-library" }
muzik-soulseek = { path = "../muzik-soulseek" }
muzik-workflow = { path = "../muzik-workflow" }
serde_json = "1"
strum = "0.28"
strum_macros = "0.28"
tempfile = "3"
tokio = { version = "1", features = ["rt", "time", "macros", "process"] }
yt-dlp = { version = "2.8.3", default-features = false }
