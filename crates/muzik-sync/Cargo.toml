[package]
name = "muzik-sync"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Copy muzik library tracks to a device in formats it plays"

[dependencies]
muzik-core = { path = "../muzik-core" }
muzik-library = { path = "../muzik-library" }
muzik-media = { path = "../muzik-media" }
muzik-store = { path = "../muzik-store" }
muzik-tags = { path = "../muzik-tags" }
parking_lot = "0.12"
rayon = "1.12"
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
