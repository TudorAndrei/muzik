[package]
name = "muzik-sync"
version = "2.12.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Copy muzik library tracks to a device in formats it plays"

[dependencies]
muzik-core = { path = "../muzik-core" }
muzik-library = { path = "../muzik-library" }
muzik-media = { path = "../muzik-media" }
muzik-tags = { path = "../muzik-tags" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
