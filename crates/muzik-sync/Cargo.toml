[package]
name = "muzik-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false
description = "Copy muzik library tracks to a device in formats it plays"

[lints]
workspace = true

[dependencies]
muzik-core = { path = "../muzik-core" }
muzik-library = { path = "../muzik-library" }
muzik-media = { path = "../muzik-media" }
muzik-store = { path = "../muzik-store" }
muzik-tags = { path = "../muzik-tags" }
parking_lot = "0.13"
rayon = "1.12"
serde_json = "1"
strum = "0.28"
strum_macros = "0.28"
thiserror = "2"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }
