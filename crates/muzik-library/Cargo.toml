[package]
name = "muzik-library"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Read and write beets SQLite libraries from Rust"

[lints]
workspace = true

[dependencies]
deunicode = "1.6"
fancy-regex = "0.19"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
shlex = "2"
thiserror = "2"
tracing = "0.1"
unicode-normalization = "0.1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
