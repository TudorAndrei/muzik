[package]
name = "muzik-soulseek"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Blocking Soulseek search and download client for muzik"

[dependencies]
muzik-core = { path = "../muzik-core" }
soulseek_rs = { package = "soulseek-rs-lib", version = "19.1" }
thiserror = "2"
tracing = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
