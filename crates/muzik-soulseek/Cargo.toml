[package]
name = "muzik-soulseek"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Blocking Soulseek search and download client for muzik"

[lints]
workspace = true

[dependencies]
keyring-core = "1.0"
muzik-core = { path = "../muzik-core" }
parking_lot = "0.12"
soulseek_rs = { package = "soulseek-rs-lib", version = "19.1" }
thiserror = "2"
tracing = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
