[package]
name = "muzik-spotify"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Spotify login, playlists, and playlist pages for muzik"

[dependencies]
chrono = "0.4"
muzik-core = { path = "../muzik-core" }
open = "5.4.4"
rspotify = { version = "0.16.1", default-features = false, features = ["client-ureq", "ureq-rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
url = "2.5.8"
