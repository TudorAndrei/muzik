[package]
name = "muzik-spotify"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Spotify login, playlists, and playlist pages for muzik"

[dependencies]
base64 = "0.22"
chrono = "0.4"
getrandom = "0.4"
muzik-core = { path = "../muzik-core" }
open = "5.4.4"
rspotify-model = "0.16.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
ureq = { version = "3.4.2", features = ["json"] }
url = "2.5.8"
