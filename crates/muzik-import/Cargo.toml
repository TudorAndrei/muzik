[package]
name = "muzik-import"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
deunicode = "1.6"
fancy-regex = "0.19"
muzik-core = { path = "../muzik-core" }
muzik-library = { path = "../muzik-library" }
muzik-match = { path = "../muzik-match" }
muzik-metadata = { path = "../muzik-metadata" }
muzik-tags = { path = "../muzik-tags" }
reflink-copy = "0.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-pickle = "1.2"
thiserror = "2"
tracing = "0.1"
trash = "5.2"
tempfile = "3"
walkdir = "2.5"
