[package]
name = "muzik-bandcamp"
version = "2.12.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Read a Bandcamp collection and download purchases"

[dependencies]
muzik-core = { path = "../muzik-core" }
serde_json = "1"
ureq = { version = "3.4.2", features = ["json"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
