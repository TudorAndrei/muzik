[package]
name = "muzik-bandcamp"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Read a Bandcamp collection and download purchases"

[dependencies]
html-escape = "0.2"
muzik-core = { path = "../muzik-core" }
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = "0.28"
strum_macros = "0.28"
ureq = { version = "3.4.2", features = ["json"] }
usage = { package = "usage-rs", version = "6.11.1" }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
