[package]
name = "muzik-bandcamp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false
description = "Read a Bandcamp collection and download purchases"

[lints]
workspace = true

[dependencies]
html-escape = "0.3.1"
muzik-core = { path = "../muzik-core" }
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = "0.28"
strum_macros = "0.28"
thiserror = "2"
ureq = { version = "3.5.2", features = ["json"] }
usage-rs = "7.4.0"
url = "2.5.9"
zip = { version = "9.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

walkdir = "2.5"
tempfile = "3"

[dev-dependencies]
bolero = "0.13.7"
proptest = { version = "1.12", default-features = false, features = ["std"] }
