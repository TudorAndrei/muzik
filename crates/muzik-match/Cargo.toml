[package]
name = "muzik-match"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false
description = "Beets-compatible music matching primitives"

[lints]
workspace = true

[dependencies]
deunicode = "1.6"
lsap = "=1.0.2"
muzik-core = { path = "../muzik-core" }
regex = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
strsim = "0.11"
strum = "0.28"
strum_macros = "0.28"
thiserror = "2"
tracing = "0.1"
chrono = "0.4"
