[package]
name = "muzik-match"
version = "2.11.3"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Beets-compatible music matching primitives"

[dependencies]
deunicode = "1.6"
lsap = "=1.0.2"
muzik-core = { path = "../muzik-core" }
regex = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
strsim = "0.11"
thiserror = "2"
tracing = "0.1"
chrono = "0.4"
