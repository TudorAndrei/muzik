[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "muzik"
dynamic = ["version"]
description = "Download, split, tag, and organize music from Soulseek, YouTube, and Bandcamp."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [
    { name = "TudorAndrei", email = "tudorandrei.dumitrascu@gmail.com" },
]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0.3",
    "musicbrainzngs>=0.7.1",
    "beets>=2.6.2",
    "playwright>=1.40",
    "aiohttp>=3.10",
    "stamina>=24.2",
    "beautifulsoup4>=4.12",
    "desktop-notifier>=6.0",
    "pydantic-ai-slim[openrouter]>=0.0.14",
    "dearpygui>=2.3.1",
    "platformdirs>=4.0",
]

[project.scripts]
muzik = "muzik.app:app"

[project.urls]
Repository = "https://github.com/TudorAndrei/muzik"
Issues = "https://github.com/TudorAndrei/muzik/issues"

[tool.maturin]
# The Rust crate lives under rust/seakarr_bridge/, not next to this
# pyproject.toml, so both paths must be given explicitly.
manifest-path = "rust/seakarr_bridge/Cargo.toml"
python-source = "."
module-name = "muzik._seakarr"
include = [
    { path = "muzik/bin/muzik-gpui", format = "wheel" },
    { path = "rust/gpui_app/**", format = "sdist" },
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.3",
    "ty>=0.0.19",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
