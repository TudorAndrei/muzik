[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muzik"
version = "1.0.0"
description = "Download, split, tag, and organize music from Soulseek, YouTube, and Bandcamp."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [
    { name = "TudorAndrei", email = "tudorandrei.dumitrascu@gmail.com" },
]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0.3",
    "musicbrainzngs>=0.7.1",
    "beets>=2.6.2",
    "playwright>=1.40",
    "aiohttp>=3.10",
    "stamina>=24.2",
    "beautifulsoup4>=4.12",
    "desktop-notifier>=6.0",
    "pydantic-ai-slim[openrouter]>=0.0.14",
    "slskd-api>=0.2.4",
    "dearpygui>=2.3.1",
    "platformdirs>=4.0",
]

[project.scripts]
muzik = "muzik.app:app"

[project.urls]
Repository = "https://github.com/TudorAndrei/muzik"
Issues = "https://github.com/TudorAndrei/muzik/issues"

[tool.hatch.build.targets.wheel]
packages = ["muzik"]

[tool.hatch.build.targets.wheel.force-include]
"assets/logo.jpeg" = "muzik/assets/logo.jpeg"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
build_command = """
python -m pip install uv
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
uv build
"""

[tool.semantic_release.branches.main]
match = "main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.3",
    "ty>=0.0.19",
]
