[package]
name = "muzik-library"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Read beets SQLite libraries from Rust"

[dependencies]
deunicode = "1.6"
fancy-regex = "0.17"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
