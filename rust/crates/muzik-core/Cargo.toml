[package]
name = "muzik-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Domain types and beets-compatible config for muzik"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.3"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
