[package]
name = "muzik-py"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Python bindings for muzik Rust libraries"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
muzik-metadata = { path = "../muzik-metadata" }
muzik-core = { path = "../muzik-core" }
muzik-match = { path = "../muzik-match" }
muzik-library = { path = "../muzik-library" }
muzik-soulseek = { path = "../muzik-soulseek" }
muzik-tags = { path = "../muzik-tags" }
pyo3 = "0.29"
serde_json = "1"

[features]
default = []
extension-module = ["pyo3/extension-module"]
