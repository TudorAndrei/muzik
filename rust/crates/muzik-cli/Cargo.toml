[package]
name = "muzik-cli"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[[bin]]
name = "muzik"
path = "src/main.rs"

[dependencies]
muzik-core = { path = "../muzik-core" }
muzik-import = { path = "../muzik-import" }
muzik-library = { path = "../muzik-library" }
muzik-match = { path = "../muzik-match" }
muzik-metadata = { path = "../muzik-metadata" }
muzik-tags = { path = "../muzik-tags" }
serde_json = "1"
serde-pickle = "1.2"
serde-saphyr = "1.3"
tokio = { version = "1", features = ["macros", "rt"] }
usage = { package = "usage-rs", version = "6.11.1", features = ["completions"] }
yt-dlp = { version = "2.8.3", default-features = false }

[dev-dependencies]
tempfile = "3"
