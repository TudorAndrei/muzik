[package]
name = "muzik-gpui"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui-kit = "=0.6.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
gpui-kit = { version = "=0.6.6", features = ["test-support"] }

[profile.release]
strip = "symbols"
opt-level = "z"
lto = true
codegen-units = 1
