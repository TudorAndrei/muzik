[package]
name = "seakarr_bridge"
version = "0.1.0"
edition = "2021"
publish = false
description = "Embedded PyO3 bridge over soulseek-rs for Muzik's Soulseek acquisition"

[lib]
name = "_seakarr"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.29"

# Pinned to a specific commit: an update needs explicit review and bridge
# tests, per PLAN.md. Verify the commit still exists before bumping it.
soulseek_rs = { package = "soulseek-rs-lib", git = "https://github.com/michel/soulseek-rs", rev = "a62bab1e6a505362109b8303aa528af03403eeae" }

[features]
default = []
# maturin enables this automatically by convention. Left off for plain
# `cargo build`/`cargo test` so the test binary can link libpython normally
# instead of the extension-module (no-link) mode meant for a loadable .so.
extension-module = ["pyo3/extension-module"]
