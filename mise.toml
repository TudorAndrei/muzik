[tools]
hk = "1.55.0"
node = "latest"
pkl = "latest"
uv = "latest"
rumdl = "latest"
typos = "latest"
gitleaks = "latest"
actionlint = "latest"
shellcheck = "latest"
zizmor = "latest"
rust = { version = "1.98.1", profile = "minimal", components = ["rustfmt", "clippy"], targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"] }
"pipx:maturin" = "latest"
"cargo:cargo-deny" = "latest"

[env]
HK_MISE = 1

[hooks]
postinstall = "hk install --mise"

[tasks.gui]
description = "Run the GPUI Kit desktop interface"
run = """
MUZIK_PYTHON="$PWD/.venv/bin/python" cargo run --manifest-path rust/gpui_app/Cargo.toml --locked
"""

[tasks.develop]
description = "Rebuild the Rust extension and reinstall muzik editable in the local venv"
run = "uvx maturin develop --uv --release"

[tasks.check]
description = "Run the complete locked verification gate"
run = """
uv lock --check
uv run ruff format --check .
uv run ruff check .
uv run ty check . --ignore unresolved-import
uv run pytest -q
uv pip check
cargo fmt --manifest-path rust/Cargo.toml --all --check
cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features -- -D warnings
cargo test --manifest-path rust/Cargo.toml --workspace
cargo build --manifest-path rust/Cargo.toml --workspace --release
cargo deny --manifest-path rust/Cargo.toml check licenses
cargo fmt --manifest-path rust/gpui_app/Cargo.toml --check
cargo clippy --manifest-path rust/gpui_app/Cargo.toml --all-targets --locked -- -D warnings
cargo test --manifest-path rust/gpui_app/Cargo.toml --locked
"""
