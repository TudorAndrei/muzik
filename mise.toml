[tools]
hk = "1.55.0"
node = "latest"
pkl = "latest"
rumdl = "latest"
typos = "latest"
gitleaks = "latest"
actionlint = "latest"
shellcheck = "latest"
zizmor = "latest"
rust = { version = "1.98.1", profile = "minimal", components = ["rustfmt", "clippy"], targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"], mr_boxington = true }
mr-boxington = "1.19.0"
cargo-binstall = "1.25.2"
"cargo:cargo-deny" = "latest"
"cargo:cargo-edit" = "0.13.13"
"cargo:cargo-auditable" = "0.7.7"
"cargo:cargo-about" = "0.9.3"
"cargo:cargo-bolero" = "0.13.5"
cocogitto = "7"

[env]
HK_MISE = 1

[hooks]
postinstall = "hk install --mise"

[tasks.gui]
description = "Run the GPUI Kit desktop interface"
run = "cargo run --locked -p muzik-gpui"

[tasks.gui-dev]
description = "Run the desktop interface with the isolated .dev profile"
env = { MUZIK_HOME = "{{config_root}}/.dev" }
run = """
scripts/dev-profile.sh init
cargo run --locked -p muzik-gpui
"""

[tasks.cli-dev]
description = "Run the CLI with the isolated .dev profile"
env = { MUZIK_HOME = "{{config_root}}/.dev" }
raw_args = true
run = "scripts/dev-profile.sh init && cargo run --locked -p muzik-cli --"

[tasks.dev-profile]
description = "Manage the .dev profile: init, copy the real database into it, or reset it"
usage = 'arg "[action]" default="init" { choices "init" "copy" "reset" }'
env = { MUZIK_HOME = "{{config_root}}/.dev" }
run = 'scripts/dev-profile.sh "${usage_action}"'

[tasks.develop]
description = "Build the Rust CLI and desktop app"
run = "cargo build --locked -p muzik-cli -p muzik-gpui"

[tasks.check]
description = "Run format, Clippy, tests, dependency, and workflow checks"
run = """
cargo fmt --all --check
cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
cargo test --workspace --locked
cargo deny check
zizmor --persona=auditor .github
"""

[tasks.features]
description = "Write FEATURES.md from the Cucumber feature files"
run = '''
{
  printf '# Features\n\n'
  printf 'This list is generated from the Cucumber scenarios in [`features/`](features).\n'
  printf 'Do not edit this file. After a change to a `.feature` file, run\n'
  printf '`mise run features`.\n'
  for dir in features/*/; do
    domain=$(basename "$dir")
    title=$(printf '%s' "$domain" | awk '{ print toupper(substr($0, 1, 1)) substr($0, 2) }')
    printf '\n## %s\n\nSource: [`features/%s`](features/%s).\n' "$title" "$domain" "$domain"
    awk '
      /^Feature:/ { sub(/^Feature: */, ""); printf "\n### %s\n\n", $0; describing = 1; text = ""; next }
      describing && /^ *(Background|Scenario|Rule|@)/ { if (text != "") print text "\n"; describing = 0 }
      describing { gsub(/^ +| +$/, ""); if ($0 != "") text = text (text == "" ? "" : " ") $0; next }
      /^ *Scenario( Outline)?:/ { sub(/^ *Scenario( Outline)?: */, ""); print "- " $0 }
    ' "$dir"*.feature
  done
} > FEATURES.md
'''

[tasks.test-scoped]
description = "Run the tests in a macOS sandbox that blocks the real muzik, beets, and music folders"
run = """
TMPDIR="$MISE_PROJECT_ROOT/.tmp" sandbox-exec -D REPO="$MISE_PROJECT_ROOT" -D HOME="$HOME" -f scripts/test-scope.sb \
  cargo test --workspace --locked --offline -- \
  --skip background_command_runs_the_program_at_lower_priority
"""

[tasks.fuzz]
description = "Run each bolero harness under libFuzzer on stable Rust"
usage = 'arg "[seconds]" default="300"'
run = """
cargo bolero test -p muzik-soulseek --sanitizer NONE -T "${usage_seconds}s" \
  fetch::tests::local_files_stay_directly_inside_the_root_for_any_peer_names
cargo bolero test -p muzik-bandcamp --sanitizer NONE -T "${usage_seconds}s" \
  tests::any_archive_writes_only_inside_the_destination
cargo bolero test -p muzik-bandcamp --sanitizer NONE -T "${usage_seconds}s" \
  tests::any_download_name_is_one_file_name_inside_the_destination
cargo bolero test -p muzik-bandcamp --sanitizer NONE -T "${usage_seconds}s" \
  tests::any_accepted_content_range_is_well_formed
cargo bolero test -p muzik-bandcamp --sanitizer NONE -T "${usage_seconds}s" \
  tests::any_numeric_content_range_is_accepted_only_inside_the_length
cargo bolero test -p muzik-media --sanitizer NONE -T "${usage_seconds}s" \
  splitter::tests::any_title_gives_one_normal_file_name
cargo bolero test -p muzik-core --sanitizer NONE -T "${usage_seconds}s" \
  chapters::tests::any_chapter_text_gives_ordered_chapters
cargo bolero test -p muzik-core --sanitizer NONE -T "${usage_seconds}s" \
  chapters::tests::any_tracklist_gives_ordered_chapters
cargo bolero test -p muzik-core --sanitizer NONE -T "${usage_seconds}s" \
  chapters::tests::any_cue_sheet_gives_ordered_chapters
cargo bolero test -p muzik-core --sanitizer NONE -T "${usage_seconds}s" \
  chapters::tests::any_info_json_gives_ordered_chapters
cargo bolero test -p muzik-import --sanitizer NONE -T "${usage_seconds}s" \
  paths::tests::rendered_paths_keep_the_template_components_for_any_field_values
cargo bolero test -p muzik-tags --sanitizer NONE -T "${usage_seconds}s" \
  tests::reading_any_bytes_does_not_panic
"""

[tasks.third-party-licenses]
description = "Write the license texts of all bundled third-party crates to one Markdown file"
usage = 'arg "[output]" default="target/THIRD_PARTY_LICENSES.md"'
run = """
mkdir -p "$(dirname "${usage_output}")"
cargo about generate --workspace --locked --fail -o "${usage_output}" about.md.hbs
"""

[tasks.check-release]
description = "Run the complete locked verification gate with the release build"
depends = ["check"]
run = "cargo auditable build --workspace --release --locked"
