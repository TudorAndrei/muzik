[tools]
hk = "1.55.0"
node = "latest"
pkl = "latest"
rumdl = "latest"
typos = "latest"
gitleaks = "latest"
actionlint = "latest"
shellcheck = "latest"
zizmor = "latest"
rust = { version = "1.98.1", profile = "minimal", components = ["rustfmt", "clippy"], targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"] }
"cargo:cargo-deny" = "latest"
cocogitto = "7"

[env]
HK_MISE = 1

[hooks]
postinstall = "hk install --mise"

[tasks.gui]
description = "Run the GPUI Kit desktop interface"
run = "cargo run --locked -p muzik-gpui"

[tasks.develop]
description = "Build the Rust CLI and desktop app"
run = "cargo build --locked -p muzik-cli -p muzik-gpui"

[tasks.check]
description = "Run format, Clippy, tests, and license checks"
run = """
cargo fmt --all --check
cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
cargo test --workspace --locked
cargo deny check licenses
"""

[tasks.check-release]
description = "Run the complete locked verification gate with the release build"
depends = ["check"]
run = "cargo build --workspace --release --locked"
