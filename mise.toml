[tasks.gui]
description = "Run the DearPyGui desktop interface"
run = "uv run muzik gui"

[tasks.check]
description = "Run the complete locked verification gate"
run = """
uv lock --check
uv run ruff format --check .
uv run ruff check .
uv run ty check . --ignore unresolved-import
uv run pytest -q
uv pip check
"""
