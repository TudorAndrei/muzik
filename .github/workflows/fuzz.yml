name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each harness
        required: false
        default: "600"

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: muzik-soulseek
            harness: fetch::tests::local_files_stay_directly_inside_the_root_for_any_peer_names
            corpus: crates/muzik-soulseek/src/__fuzz__
          - package: muzik-bandcamp
            harness: tests::any_archive_writes_only_inside_the_destination
            corpus: crates/muzik-bandcamp/src/__fuzz__
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install_args: rust cargo-binstall cargo:cargo-bolero
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.corpus }}
          key: fuzz-corpus-${{ matrix.package }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.package }}-
      - name: Fuzz the harness
        env:
          PACKAGE: ${{ matrix.package }}
          HARNESS: ${{ matrix.harness }}
          SECONDS_EACH: ${{ inputs.seconds || '600' }}
        run: cargo bolero test -p "$PACKAGE" --sanitizer NONE -T "${SECONDS_EACH}s" "$HARNESS"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes-${{ matrix.package }}
          path: ${{ matrix.corpus }}/*/crashes
          if-no-files-found: ignore
