name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install_args: cocogitto hk
      - run: cog check --from-latest-tag

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install GPUI Linux libraries
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            install -y --no-install-recommends \
            ffmpeg libfontconfig-dev libwayland-dev libwebkit2gtk-4.1-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev \
            vulkan-validationlayers libvulkan1
      - uses: jdx/mise-action@v4
        with:
          install_args: rust mr-boxington hk zizmor cargo-binstall cargo:cargo-deny
      - uses: jdx/mr-boxington-action@v1
        with:
          toolchain: "1.98.1"
      - run: mise run check

  gpui-macos:
    name: GPUI on macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install_args: rust mr-boxington hk
      - uses: jdx/mr-boxington-action@v1
        with:
          toolchain: "1.98.1"
      - run: cargo test --manifest-path apps/gui/Cargo.toml --locked
      - run: cargo run --manifest-path apps/gui/Cargo.toml --locked -- --version
