name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            code=false
            files=$(git diff --name-only "$BASE...$HEAD")
            while IFS= read -r path; do
              case "$path" in
                *.md | .rumdl.toml | LICENSE*) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  commits:
    name: Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install_args: cocogitto hk
      - run: cog check --from-latest-tag

  check:
    name: Check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      MISE_ENV: ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install GPUI Linux libraries
        timeout-minutes: 20
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            install -y --no-install-recommends \
            libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev \
            vulkan-validationlayers libvulkan1
      - uses: jdx/mise-action@v4
        with:
          install_args: rust mr-boxington hk zizmor cargo-binstall cargo:cargo-deny conda:ffmpeg
      - uses: jdx/mr-boxington-action@v1
        with:
          toolchain: "1.98.1"
      - run: mise run --skip-tools check

  gpui-macos:
    name: GPUI on macOS
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install_args: rust mr-boxington hk
      - uses: jdx/mr-boxington-action@v1
        with:
          toolchain: "1.98.1"
      - run: cargo test --manifest-path apps/gui/Cargo.toml --locked
      - run: cargo run --manifest-path apps/gui/Cargo.toml --locked -- --version
