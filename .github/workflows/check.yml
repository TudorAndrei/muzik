name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install_args: cocogitto hk
      - run: cog check --from-latest-tag

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install GPUI Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang ffmpeg libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev vulkan-validationlayers libvulkan1
      - uses: jdx/mise-action@v4
      - run: mise run check

  gpui-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install_args: rust hk
      - run: cargo test --manifest-path apps/gui/Cargo.toml --locked
      - run: cargo build --manifest-path apps/gui/Cargo.toml --locked
      - run: target/debug/muzik-gpui --version
