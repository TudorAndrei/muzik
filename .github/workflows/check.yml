name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install GPUI Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev vulkan-validationlayers libvulkan1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - uses: jdx/mise-action@v4
      - run: uv sync --locked --dev
      - run: mise run check

  gpui-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cargo test --manifest-path rust/gpui_app/Cargo.toml --locked
      - run: cargo build --manifest-path rust/gpui_app/Cargo.toml --locked
      - run: rust/gpui_app/target/debug/muzik-gpui --version
