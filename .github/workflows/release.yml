name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.check.outputs.released }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read version and check for an existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(grep -m1 -E '^version = ' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          tag="v${version}"
          {
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Release ${tag} already exists; nothing to do."
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "Version ${version} has no release yet; will create ${tag}."
          fi
      - uses: astral-sh/setup-uv@v9.0.0
        if: steps.check.outputs.released == 'true'
        with:
          enable-cache: false
      - name: Build distributions
        if: steps.check.outputs.released == 'true'
        run: uv build
      - name: Create the tagged release
        if: steps.check.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          SHA: ${{ github.sha }}
        run: >-
          gh release create "$TAG"
          dist/muzik-*.whl
          dist/muzik-*.tar.gz
          --target "$SHA"
          --title "$TAG"
          --generate-notes

  bump-homebrew-tap:
    name: Update Homebrew tap formula
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Point the tap formula at the new release
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          url="https://github.com/TudorAndrei/muzik/releases/download/${TAG}/muzik-${version}.tar.gz"
          sha=""
          for _ in 1 2 3 4 5 6; do
            if sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1) && [ -n "$sha" ]; then
              break
            fi
            sleep 5
          done
          [ -n "$sha" ] || { echo "could not fetch $url"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:TudorAndrei/homebrew-muzik.git tap
          cd tap
          sed -i -E "s#url \".*\"#url \"${url}\"#" Formula/muzik.rb
          sed -i -E "s#sha256 \"[0-9a-f]{64}\"#sha256 \"${sha}\"#" Formula/muzik.rb
          if git diff --quiet; then
            echo "formula already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "muzik ${version}"
          git push
