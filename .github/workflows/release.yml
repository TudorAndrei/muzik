name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Compute next version
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.version.outputs.released }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install: false
          cache: false
      - name: Compute next version from conventional commits
        id: version
        run: |
          set -euo pipefail
          # cocogitto exits 0 whether or not a bump is due and prints a message
          # on no-bump, so decide from the version token, not the exit code.
          raw=$(mise x cocogitto@7 -- cog bump --auto --dry-run 2>/dev/null || true)
          next=$(printf '%s\n' "$raw" | grep -oE '^v?[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          if [ -n "$next" ]; then
            next="${next#v}"
            {
              echo "released=true"
              echo "tag=v${next}"
              echo "version=${next}"
            } >> "$GITHUB_OUTPUT"
            echo "Next version: ${next}"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No conventional commits warrant a release."
          fi

  build-macos:
    name: Build macOS arm64 wheel
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install_args: rust hk
      - name: Set the shared version in Cargo.toml
        # Cargo.toml's version is what maturin reads for the wheel's own
        # version (pyproject.toml declares it "dynamic"), so every build job
        # sets it to the same conventional-commits-derived version before
        # building — otherwise each wheel would build against whatever
        # version happens to be committed in the crate.
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i '' "s/^version = \".*\"/version = \"${VERSION}\"/" \
            rust/seakarr_bridge/Cargo.toml
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Build GPUI desktop app
        run: |
          MUZIK_NATIVE_TARGET=aarch64-apple-darwin ./scripts/build-native-gui.sh
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist
      - name: Check desktop binary in wheel
        run: python scripts/check-native-wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-arm64
          path: dist

  build-linux:
    name: Build Linux x86_64 wheel
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install_args: rust hk
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install GPUI Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev vulkan-validationlayers libvulkan1
      - name: Build GPUI desktop app
        run: ./scripts/build-native-gui.sh
      - name: Set the shared version in Cargo.toml
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" \
            rust/seakarr_bridge/Cargo.toml
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: off
          args: --release --out dist --compatibility off
      - name: Check desktop binary in wheel
        run: python scripts/check-native-wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist

  build-sdist:
    name: Build source archive
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set the shared version in Cargo.toml
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" \
            rust/seakarr_bridge/Cargo.toml
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Check native source in sdist
        run: python scripts/check-native-sdist.py
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  release:
    name: Publish GitHub release
    needs: [version, build-macos, build-linux, build-sdist]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ needs.version.outputs.released }}
      tag: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            dist/*.whl \
            dist/*.tar.gz \
            --target "$SHA" \
            --title "$TAG" \
            --generate-notes

  bump-homebrew-tap:
    name: Update Homebrew tap formula
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Point the tap formula at the new release
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          url="https://github.com/TudorAndrei/muzik/releases/download/${TAG}/muzik-${version}.tar.gz"
          sha=""
          for _ in 1 2 3 4 5 6; do
            if sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1) && [ -n "$sha" ]; then
              break
            fi
            sleep 5
          done
          [ -n "$sha" ] || { echo "could not fetch $url"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:TudorAndrei/homebrew-muzik.git tap
          cd tap
          sed -i -E "s#url \".*\"#url \"${url}\"#" Formula/muzik.rb
          sed -i -E "s#sha256 \"[0-9a-f]{64}\"#sha256 \"${sha}\"#" Formula/muzik.rb
          if git diff --quiet; then
            echo "formula already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "muzik ${version}"
          git push
