name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Version, tag, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.version.outputs.released }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install: false
          cache: false
      - name: Compute next version from conventional commits
        id: version
        run: |
          set -euo pipefail
          if next=$(mise x cocogitto@7 -- cog bump --auto --dry-run 2>/dev/null) \
              && [ -n "$next" ]; then
            {
              echo "released=true"
              echo "tag=v${next}"
            } >> "$GITHUB_OUTPUT"
            echo "Next version: ${next}"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No conventional commits warrant a release."
          fi
      - uses: astral-sh/setup-uv@v9.0.0
        if: steps.version.outputs.released == 'true'
        with:
          enable-cache: false
      - name: Build and publish the release
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git tag "$TAG"          # local only, so hatch-vcs derives the version
          uv build
          gh release create "$TAG" \
            dist/muzik-*.whl \
            dist/muzik-*.tar.gz \
            --target "$SHA" \
            --title "$TAG" \
            --generate-notes

  bump-homebrew-tap:
    name: Update Homebrew tap formula
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Point the tap formula at the new release
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          url="https://github.com/TudorAndrei/muzik/releases/download/${TAG}/muzik-${version}.tar.gz"
          sha=""
          for _ in 1 2 3 4 5 6; do
            if sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1) && [ -n "$sha" ]; then
              break
            fi
            sleep 5
          done
          [ -n "$sha" ] || { echo "could not fetch $url"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:TudorAndrei/homebrew-muzik.git tap
          cd tap
          sed -i -E "s#url \".*\"#url \"${url}\"#" Formula/muzik.rb
          sed -i -E "s#sha256 \"[0-9a-f]{64}\"#sha256 \"${sha}\"#" Formula/muzik.rb
          if git diff --quiet; then
            echo "formula already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "muzik ${version}"
          git push
