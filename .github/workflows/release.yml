name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Build and publish this existing tag instead of creating a new version
        required: false
        default: ""

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.version }}
    steps:
      - name: Use the requested tag
        if: inputs.tag != ''
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --silent
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Require a passing check on this commit
        if: inputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          passed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/check.yml/runs?head_sha=${SHA}&status=success" -q .total_count)
          if [ "$passed" = "0" ]; then
            echo "::error::The Check workflow has not passed on ${SHA}. Wait for it, then run the release again."
            exit 1
          fi
      - uses: actions/checkout@v7
        if: inputs.tag == ''
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v4
        if: inputs.tag == ''
        with:
          install_args: rust cocogitto hk
      - run: cargo fetch --locked
        if: inputs.tag == ''
      - name: Set release Git access
        if: inputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - name: Bump workspace version and create tag
        if: inputs.tag == ''
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          HK: 0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cog bump --auto
          echo "version=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
      - name: Report the release tag
        id: tag
        env:
          EXISTING: ${{ steps.existing.outputs.version }}
          BUMPED: ${{ steps.bump.outputs.version }}
        run: echo "version=${EXISTING:-$BUMPED}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - name: Install GPUI Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev vulkan-validationlayers libvulkan1
      - uses: jdx/mise-action@v4
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: ${{ matrix.target }}
      - name: Build Rust apps
        run: cargo build --release --locked -p muzik-cli -p muzik-gpui
      - name: Package apps and license files
        env:
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/package
          cp target/release/muzik target/release/muzik-gpui dist/package/
          cp LICENSE LICENSE-APACHE NOTICE dist/package/
          cp apps/cli/LICENSE dist/package/CLI-LICENSE
          cp apps/gui/LICENSE dist/package/GPUI-LICENSE
          mkdir -p dist/package/apps/cli dist/package/apps/gui
          cp apps/cli/LICENSE dist/package/apps/cli/LICENSE
          cp apps/gui/LICENSE dist/package/apps/gui/LICENSE
          for source in crates/*/LICENSE crates/*/NOTICE crates/*/THIRD_PARTY_NOTICES.md; do
            if [ -f "$source" ]; then
              mkdir -p "dist/package/$(dirname "$source")"
              cp "$source" "dist/package/$source"
            fi
          done
          test -f dist/package/crates/muzik-library/NOTICE
          test -f dist/package/crates/muzik-soulseek/THIRD_PARTY_NOTICES.md
          test -f dist/package/crates/muzik-workflow/LICENSE
          test -f dist/package/apps/gui/LICENSE
          tar -czf "dist/muzik-${TAG}-${TARGET}.tar.gz" -C dist/package .
          shasum -a 256 "dist/muzik-${TAG}-${TARGET}.tar.gz" > "dist/muzik-${TAG}-${TARGET}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: muzik-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: muzik-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release create "$TAG" dist/* --generate-notes --verify-tag
