name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      released: ${{ steps.release.outputs.released || 'false' }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # Credentials must persist so python-semantic-release can push the version
      # bump commit and the new tag back to main.
      - uses: actions/checkout@v7 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - name: Force branch to the pushed commit
        run: git reset --hard "$GITHUB_SHA"
      - name: Determine version, tag, and release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: github-actions
          git_committer_email: actions@users.noreply.github.com
      - name: Upload built distributions to the release
        uses: python-semantic-release/publish-action@v10.6.1
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

  bump-homebrew-tap:
    name: Update Homebrew tap formula
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Point the tap formula at the new release
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          url="https://github.com/TudorAndrei/muzik/releases/download/${TAG}/muzik-${version}.tar.gz"
          sha=""
          for _ in 1 2 3 4 5 6; do
            if sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1) && [ -n "$sha" ]; then
              break
            fi
            sleep 5
          done
          [ -n "$sha" ] || { echo "could not fetch $url"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:TudorAndrei/homebrew-muzik.git tap
          cd tap
          sed -i -E "s#url \".*\"#url \"${url}\"#" Formula/muzik.rb
          sed -i -E "s#sha256 \"[0-9a-f]{64}\"#sha256 \"${sha}\"#" Formula/muzik.rb
          if git diff --quiet; then
            echo "formula already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "muzik ${version}"
          git push
