name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Build and publish this existing tag instead of creating a new version
        required: false
        default: ""

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.version }}
    steps:
      - name: Use the requested tag
        if: inputs.tag != ''
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --silent
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Require a passing check on this commit
        if: inputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          passed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/check.yml/runs?head_sha=${SHA}&status=success" -q .total_count)
          if [ "$passed" = "0" ]; then
            echo "::error::The Check workflow has not passed on ${SHA}. Wait for it, then run the release again."
            exit 1
          fi
      - uses: actions/checkout@v7
        if: inputs.tag == ''
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v4
        if: inputs.tag == ''
        with:
          install_args: rust mr-boxington cocogitto hk cargo:cargo-edit
      - run: cargo fetch --locked
        if: inputs.tag == ''
      - name: Set release Git access
        if: inputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - name: Bump workspace version and create tag
        if: inputs.tag == ''
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          HK: 0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before=$(git describe --tags --abbrev=0)
          cog bump --auto
          after=$(git describe --tags --abbrev=0)
          if [ "$after" = "$before" ]; then
            echo "::error::No commit since ${before} needs a new version. Use feat, fix, or perf commits."
            exit 1
          fi
          echo "version=${after}" >> "$GITHUB_OUTPUT"
      - name: Report the release tag
        id: tag
        env:
          EXISTING: ${{ steps.existing.outputs.version }}
          BUMPED: ${{ steps.bump.outputs.version }}
        run: echo "version=${EXISTING:-$BUMPED}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - name: Install GPUI Linux libraries
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            install -y --no-install-recommends \
            libfontconfig-dev libwayland-dev libwebkit2gtk-4.1-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev \
            vulkan-validationlayers libvulkan1
      - uses: jdx/mise-action@v4
        with:
          install_args: rust mr-boxington cargo:cargo-auditable
      - uses: jdx/mr-boxington-action@v1
        with:
          toolchain: "1.98.1"
          save-on-workflow-dispatch: true
      - name: Build Rust apps
        run: cargo auditable build --release --locked -p muzik-cli -p muzik-gpui
      - name: Package the CLI, the desktop app, and license files
        env:
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          licenses() {
            cp LICENSE LICENSE-APACHE NOTICE "$1/"
            mkdir -p "$1/apps/cli" "$1/apps/gui"
            cp apps/cli/LICENSE "$1/apps/cli/LICENSE"
            cp apps/gui/LICENSE "$1/apps/gui/LICENSE"
            for source in crates/*/LICENSE crates/*/NOTICE crates/*/THIRD_PARTY_NOTICES.md; do
              if [ -f "$source" ]; then
                mkdir -p "$1/$(dirname "$source")"
                cp "$source" "$1/$source"
              fi
            done
            test -f "$1/crates/muzik-library/NOTICE"
            test -f "$1/crates/muzik-soulseek/THIRD_PARTY_NOTICES.md"
            test -f "$1/crates/muzik-workflow/LICENSE"
          }
          mkdir -p dist/cli dist/app
          cp target/release/muzik dist/cli/
          licenses dist/cli
          tar -czf "dist/muzik-cli-${TAG}-${TARGET}.tar.gz" -C dist/cli .
          licenses dist/app
          if [ "$RUNNER_OS" = "macOS" ]; then
            packaging/macos/build-app.sh target/release/muzik-gpui "$TAG" dist/app
            ditto -c -k --sequesterRsrc dist/app "dist/Muzik-${TAG}-${TARGET}.zip"
          else
            cp target/release/muzik-gpui dist/app/
            tar -czf "dist/muzik-gpui-${TAG}-${TARGET}.tar.gz" -C dist/app .
          fi
          cd dist
          for archive in *.tar.gz *.zip; do
            if [ -f "$archive" ]; then
              shasum -a 256 "$archive" > "$archive.sha256"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: muzik-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: muzik-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release create "$TAG" dist/* --generate-notes --verify-tag

  homebrew:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Read the app checksum
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          sha=$(gh release download "$TAG" -p "Muzik-${TAG}-aarch64-apple-darwin.zip.sha256" -O - | cut -d' ' -f1)
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::No valid checksum for $TAG"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Update the cask in this repository
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          cask=packaging/homebrew/Casks/muzik.rb
          sed -i -E "s/^  version \"[^\"]+\"/  version \"${VERSION}\"/; s/^  sha256 \"[0-9a-f]{64}\"/  sha256 \"${SHA}\"/" "$cask"
          grep -q "version \"${VERSION}\"" "$cask"
          grep -q "sha256 \"${SHA}\"" "$cask"
          if git diff --quiet; then
            echo "The cask is already current."
            exit 0
          fi
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(homebrew): update the cask to v${VERSION}"
          git push origin HEAD:main
      - name: Update the Homebrew tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:TudorAndrei/homebrew-muzik.git tap
          cp packaging/homebrew/Casks/muzik.rb tap/Casks/muzik.rb
          cd tap
          if git diff --quiet; then
            echo "The tap is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "feat: update muzik to ${VERSION}"
          git push origin HEAD:main
