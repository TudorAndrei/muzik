name: Differential

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: differential
  cancel-in-progress: true

jobs:
  beets-fixtures:
    name: Beets fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install_args: uv@0.13.5
      - run: mise exec uv@0.13.5 -- scripts/beets-fixtures.sh
      - run: git diff --exit-code
