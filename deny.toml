[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "0BSD",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "bzip2-1.0.6",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
private = { ignore = true }
exceptions = [
    { crate = "media-seek", allow = ["GPL-3.0-only"] },
    { crate = "yt-dlp", allow = ["GPL-3.0-only"] },
    { crate = "ring", allow = ["ISC"] },
    { crate = "rustls-webpki", allow = ["ISC"] },
    { crate = "untrusted", allow = ["ISC"] },
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]
