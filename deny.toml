[advisories]
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "instant is unmaintained; only gpui-kit 0.7 pulls it in" },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; only gpui-kit 0.7 pulls it in" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is unmaintained; only gpui-kit 0.7 pulls it in" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is unmaintained; only gpui-kit 0.7 pulls it in" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; only gpui-kit 0.7 pulls it in" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "0BSD",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "bzip2-1.0.6",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
private = { ignore = true }
exceptions = [
    { crate = "ring", allow = ["ISC"] },
    { crate = "rustls-webpki", allow = ["ISC"] },
    { crate = "untrusted", allow = ["ISC"] },
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]
