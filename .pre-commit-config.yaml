repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run ty check . --ignore unresolved-import
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit, pre-push]
      - id: lock-check
        name: lock check
        entry: uv lock --check
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: format-check
        name: format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: pip-check
        name: installed package check
        entry: uv pip check
        language: system
        pass_filenames: false
        stages: [pre-push]
