[package]
name = "muzik-gpui"
version = "2.11.1"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[dependencies]
gpui-kit = "=0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
muzik-core = { path = "../../crates/muzik-core" }
muzik-jobs = { path = "../../crates/muzik-jobs" }
muzik-runner = { path = "../../crates/muzik-runner" }
muzik-soulseek = { path = "../../crates/muzik-soulseek" }
chrono = "0.4"
ureq = "3.4.2"
url = "2.5.8"
strum = "0.28"
strum_macros = "0.28"

[dev-dependencies]
gpui-kit = { version = "=0.7.0", features = ["test-support"] }
tempfile = "3"
