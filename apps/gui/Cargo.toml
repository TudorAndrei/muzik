[package]
name = "muzik-gpui"
version.workspace = true
edition = "2021"
publish = false
license = "GPL-3.0-only"

[dependencies]
bytesize = "2.3"
gpui-kit = "=0.7.0"
keyring = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
muzik-bandcamp = { path = "../../crates/muzik-bandcamp" }
muzik-core = { path = "../../crates/muzik-core" }
muzik-store = { path = "../../crates/muzik-store" }
muzik-runner = { path = "../../crates/muzik-runner" }
muzik-soulseek = { path = "../../crates/muzik-soulseek" }
muzik-spotify = { path = "../../crates/muzik-spotify" }
chrono = "0.4"
ureq = "3.4.2"
url = "2.5.8"
strum = "0.28"
strum_macros = "0.28"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
gpui-kit = { version = "=0.7.0", features = ["test-support"] }
tempfile = "3"
