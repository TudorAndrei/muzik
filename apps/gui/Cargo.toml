[package]
name = "muzik-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license = "GPL-3.0-only"

[lints]
workspace = true

[dependencies]
anyhow = "1"
async-channel = "2.5"
gpui-kit = { version = "=0.10.0", features = ["gpui-fast"] }
keyring = "4.2"
serde_json = "1"
muzik-core = { path = "../../crates/muzik-core" }
muzik-store = { path = "../../crates/muzik-store" }
muzik-runner = { path = "../../crates/muzik-runner" }
muzik-soulseek = { path = "../../crates/muzik-soulseek" }
muzik-spotify = { path = "../../crates/muzik-spotify" }
strum = "0.28"
strum_macros = "0.28"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
gpui-kit = { version = "=0.10.0", features = ["test-support"] }
tempfile = "3"
