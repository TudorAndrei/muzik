[package]
name = "muzik-cli"
version.workspace = true
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lints]
workspace = true

[[bin]]
name = "muzik"
path = "src/main.rs"

[dependencies]
muzik-bandcamp = { path = "../../crates/muzik-bandcamp" }
muzik-core = { path = "../../crates/muzik-core" }
muzik-store = { path = "../../crates/muzik-store" }
muzik-runner = { path = "../../crates/muzik-runner" }
muzik-import = { path = "../../crates/muzik-import" }
muzik-library = { path = "../../crates/muzik-library" }
muzik-media = { path = "../../crates/muzik-media" }
muzik-tags = { path = "../../crates/muzik-tags" }
muzik-workflow = { path = "../../crates/muzik-workflow" }
muzik-soulseek = { path = "../../crates/muzik-soulseek" }
muzik-spotify = { path = "../../crates/muzik-spotify" }
muzik-sync = { path = "../../crates/muzik-sync" }
anyhow = "1"
bytesize = "2.3"
ctrlc = "3.5"
dialoguer = { version = "0.12", default-features = false }
edit = { version = "0.1.5", features = ["quoted-env"] }
keyring = "4.2"
parking_lot = "0.12"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
strum_macros = "0.28"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
usage = { package = "usage-rs", version = "6.11.1", features = ["completions"] }
