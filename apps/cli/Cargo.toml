[package]
name = "muzik-cli"
version = "2.6.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[[bin]]
name = "muzik"
path = "src/main.rs"

[dependencies]
muzik-core = { path = "../../crates/muzik-core" }
muzik-jobs = { path = "../../crates/muzik-jobs" }
muzik-runner = { path = "../../crates/muzik-runner" }
muzik-import = { path = "../../crates/muzik-import" }
muzik-library = { path = "../../crates/muzik-library" }
muzik-tags = { path = "../../crates/muzik-tags" }
muzik-workflow = { path = "../../crates/muzik-workflow" }
muzik-soulseek = { path = "../../crates/muzik-soulseek" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde-saphyr = "1.3"
tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"
usage = { package = "usage-rs", version = "6.11.1", features = ["completions"] }
yt-dlp = { version = "2.8.3", default-features = false }
