[package]
name = "muzik-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"
publish = false

[lints]
workspace = true

[lib]
name = "muzik_server"
path = "src/lib.rs"

[[bin]]
name = "muzik-server"
path = "src/main.rs"

[dependencies]
muzik-core = { path = "../../crates/muzik-core" }
muzik-runner = { path = "../../crates/muzik-runner" }
futures-util = "0.3"
parking_lot = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
topcoat = { version = "=0.12.1", default-features = false, features = ["asset", "cookie", "discover", "router", "runtime", "serve", "session", "sse", "view"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
usage-rs = "7.4.0"

[dev-dependencies]
tempfile = "3"
