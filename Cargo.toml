[workspace]
members = ["crates/*", "apps/cli", "apps/gui", "apps/server"]
resolver = "3"

[patch.crates-io]
# The published 0.13.5 pins indexmap 2.11.2, which conflicts with GPUI's
# proc-macro-crate. Upstream has removed that pin; keep the fix reproducible.
bolero-generator-derive = { git = "https://github.com/camshaft/bolero", rev = "968b6b3510acbc22123e035278b1665e671a4c21" }

[workspace.package]
version = "2.17.0"
edition = "2024"
rust-version = "1.99"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
panic_in_result_fn = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
strip = "symbols"
opt-level = "z"
lto = true
codegen-units = 1

[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
